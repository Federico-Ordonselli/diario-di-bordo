name: diario_bordo
description: Diario di bordo offline per il completamento al 100%, checklist e laboratorio di sintesi. Tracker non ufficiale.
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  drift: ^2.35.4
  drift_flutter: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/datasets/

# Icona e splash: generati da assets/branding/ con
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0b101b"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_monochrome: assets/branding/icon-foreground.png
  min_sdk_android: 21
  macos:
    generate: true
    image_path: assets/branding/icon.png
  windows:
    generate: true
    image_path: assets/branding/icon.png
    icon_size: 256

flutter_native_splash:
  color: "#0b101b"
  image: assets/branding/splash.png
  android_12:
    color: "#0b101b"
    image: assets/branding/splash-android12.png
    icon_background_color: "#0b101b"
  ios: true
  android: true
  web: false
